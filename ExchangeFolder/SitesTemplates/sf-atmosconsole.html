<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body id="body"
  data-vow-name="Atmos Console"
  data-vow-category="scifi"
  data-vow-description="Starship environmental console — temperature, humidity, pressure, particulates and trace gases with a sweeping 24h trend graph; indigo and cornflower phosphor look"
  data-vow-class="C"
  data-vow-frames="16"
  data-vow-fps="4"
  data-vow-refresh="0">
<canvas id="screen"></canvas>
<script>
'use strict'
/* Logical design space is 480x320; the canvas matches the real viewport and
 * is scaled, so backend grabs at 320x240 render natively (no cropping). */
const W=480,H=320
const cv=document.getElementById('screen')
const VW=window.innerWidth||W, VH=window.innerHeight||H
cv.width=VW; cv.height=VH
const cx=cv.getContext('2d')

const FRAME_COUNT=16

function snap565(r,g,b){return[Math.min(248,~~(r/8)*8),Math.min(252,~~(g/4)*4),Math.min(248,~~(b/8)*8)]}
function css(r,g,b){const[a,c,e]=snap565(r,g,b);return`rgb(${a},${c},${e})`}

/* Floyd-Steinberg dithering to the BGR565 grid — runs over real pixels. */
function dither(){
  const id=cx.getImageData(0,0,VW,VH),d=id.data
  for(let y=0;y<VH;y++)for(let x=0;x<VW;x++){
    const i=(y*VW+x)*4
    for(let c=0;c<3;c++){
      const bits=c===1?6:5,max=(1<<bits)-1,old=d[i+c]
      const nv=Math.round(old/255*max)/max*255,err=old-nv
      d[i+c]=nv
      if(x+1<VW)d[i+4+c]+=err*7/16
      if(y+1<VH){if(x>0)d[i+(VW-1)*4+c]+=err*3/16;d[i+VW*4+c]+=err*5/16;if(x+1<VW)d[i+(VW+1)*4+c]+=err/16}
    }
  }
  cx.putImageData(id,0,0)
}

/* Indigo / cornflower phosphor palette — same family as the city flyover.
 * High-luminance foregrounds on deep indigo so contrast survives TN
 * panels viewed off-axis. */
const P={
  bg:   css(4,6,22),   pan: css(8,12,38),  pan2:css(12,18,52),
  far:  css(56,76,176),mid: css(100,132,236),near:css(176,204,255),
  vio:  css(156,118,252),vioD:css(70,52,140),
  bdr:  css(64,96,224),bdr2:css(28,40,110),
  gn:   css(96,240,140),gnD: css(30,96,56),
  am:   css(255,190,96),amD: css(110,76,30),
  rd:   css(255,72,72),
  tx:   css(238,244,255),tx2:css(154,176,238),tx3:css(94,110,180),
  wh:   css(250,252,255),
}

function fill(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x,y,w,h)}
function ln(x1,y1,x2,y2,c,lw=1){cx.strokeStyle=c;cx.lineWidth=lw;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke()}
function box(x,y,w,h,c,lw=1){cx.strokeStyle=c;cx.lineWidth=lw;cx.strokeRect(x,y,w,h)}
function dot(x,y,r,c){cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.fillStyle=c;cx.fill()}
function txt(s,x,y,c,sz=9,al='left',bold=false){
  cx.font=`${bold?'bold ':''}${sz}px monospace`;cx.fillStyle=c;cx.textAlign=al;cx.fillText(s,x,y);cx.textAlign='left'
}
function bar(x,y,w,h,pct,fg){
  fill(x,y,w,h,css(10,16,48))
  fill(x,y,~~(w*Math.max(0.03,Math.min(1,pct))),h,fg)
  box(x,y,w,h,P.bdr2,0.6)
}

/* ── 24h synthetic trend curves — pure functions, loop-periodic ──────── */
function temp24(u){return 21.0+2.6*Math.sin(u*Math.PI*2-2.2)+0.8*Math.sin(u*Math.PI*4+1.0)}
function hum24(u){return 50+9*Math.sin(u*Math.PI*2+0.9)+3*Math.sin(u*Math.PI*4+2.6)}

function render(frame){
  frame=((frame%FRAME_COUNT)+FRAME_COUNT)%FRAME_COUNT
  cx.setTransform(VW/W,0,0,VH/H,0,0)
  const bl=(frame%4)<2              /* slow 1 Hz indicator blink           */
  const ph=frame/FRAME_COUNT
  const th=ph*Math.PI*2

  /* Current readings = the trend curves sampled at the sweep cursor, so
   * the big numbers and the graph always agree. All deterministic.       */
  const temp=temp24(ph)
  const hum =hum24(ph)
  const press=1013.2+2.5*Math.sin(th+4.0)
  const pm25=8.2+2.5*Math.sin(th+1.3)
  const pm10=14.6+3.0*Math.sin(th+3.4)
  const co2 =412+14*Math.sin(th+0.7)
  const o3  =31+4*Math.sin(th+2.4)
  const no2 =12+3*Math.sin(th+5.1)
  const voc =87+6*Math.sin(th+3.9)
  const tRise=Math.cos(ph*Math.PI*2-2.2)>0   /* temp derivative sign      */

  const hh=16*3600+22*60+frame*2
  const hts=`${String(~~(hh/3600)%24).padStart(2,'0')}:${String(~~(hh/60)%60).padStart(2,'0')}:${String(hh%60).padStart(2,'0')}`

  /* ── Background ── */
  fill(0,0,W,H,P.bg)

  /* ── Bezel — double border, console look (same family as the city) ── */
  box(2,2,W-4,H-4,P.bdr,1.5)
  box(6,6,W-12,H-12,P.bdr2,0.8)

  /* ── Header strip ── */
  fill(7,7,W-14,15,css(8,12,40))
  ln(7,22,W-7,22,P.bdr2)
  txt('ATMOS CONSOLE — DECK 4 ENV',13,18,P.tx,10,'left',true)
  txt('LIFE SUPPORT NOMINAL',W/2+22,18,P.tx3,8)
  txt(`SYS ${(44.2+ph).toFixed(2)}`,W-13,18,P.tx2,8,'right')

  /* ══ ROW 1 — primary readouts: TEMP / HUM / PRESS ═════════════════ */
  const cells=[
    {x:13, lab:'TEMPERATURE',val:temp.toFixed(1),unit:'°C', pct:(temp-16)/10, col:P.near,
     sub:tRise?'▲ RISING':'▼ FALLING',subc:tRise?P.am:P.mid},
    {x:166,lab:'HUMIDITY',   val:hum.toFixed(0), unit:'%',  pct:hum/100,      col:P.mid,
     sub:'DEW 10.4°C',subc:P.tx3},
    {x:319,lab:'PRESSURE',   val:press.toFixed(1),unit:'hPa',pct:(press-990)/40,col:P.vio,
     sub:'SEA-LVL REF',subc:P.tx3},
  ]
  for(const c of cells){
    const y=28,w=148,h=88
    fill(c.x,y,w,h,P.pan)
    box(c.x,y,w,h,P.bdr2,0.8)
    fill(c.x,y,w,2,c.col)
    txt(c.lab,c.x+7,y+14,P.tx3,8)
    txt(c.val,c.x+7,y+47,P.wh,26,'left',true)
    txt(c.unit,c.x+7+cx.measureText(c.val).width+6,y+47,c.col,11,'left',true)
    bar(c.x+7,y+58,w-14,7,c.pct,c.col)
    txt(c.sub,c.x+7,y+80,c.subc,8,'left',true)
    /* corner tick — console detail */
    ln(c.x+w-12,y+6,c.x+w-6,y+6,c.col,1);ln(c.x+w-6,y+6,c.x+w-6,y+12,c.col,1)
  }

  /* ══ ROW 2 — particulates + trace gases ═══════════════════════════ */
  const r2y=122,r2h=62
  /* particulates */
  fill(13,r2y,226,r2h,P.pan)
  box(13,r2y,226,r2h,P.bdr2,0.8)
  fill(13,r2y,226,2,P.mid)
  txt('PARTICULATES',20,r2y+13,P.tx3,8)
  txt('AQI 23 · CLEAN',232,r2y+13,P.gn,8,'right',true)
  const parts=[['PM2.5',pm25,25,'µg/m³'],['PM10',pm10,50,'µg/m³']]
  for(let i=0;i<2;i++){
    const[lab,v,max,un]=parts[i],ry=r2y+22+i*18
    txt(lab,20,ry+8,P.tx2,8)
    bar(62,ry+1,108,8,v/max,v/max>0.6?P.am:P.mid)
    txt(v.toFixed(1)+' '+un,232,ry+8,P.near,8,'right')
  }
  /* trace gases */
  fill(244,r2y,223,r2h,P.pan)
  box(244,r2y,223,r2h,P.bdr2,0.8)
  fill(244,r2y,223,2,P.vio)
  txt('TRACE GASES',251,r2y+13,P.tx3,8)
  const gases=[
    ['CO₂',co2.toFixed(0)+' ppm',co2>420],
    ['O₃', o3.toFixed(0)+' ppb', false],
    ['NO₂',no2.toFixed(0)+' ppb',false],
    ['VOC',voc.toFixed(0)+' idx',false],
  ]
  for(let i=0;i<4;i++){
    const[lab,val,warn]=gases[i]
    const gx=251+(i%2)*112,gy=r2y+22+~~(i/2)*18
    dot(gx+4,gy+4,3,warn?P.am:P.gn)
    txt(lab,gx+12,gy+8,P.tx2,8)
    txt(val,gx+104,gy+8,warn?P.am:P.near,8,'right')
  }

  /* ══ ROW 3 — 24h trend graph with sweep cursor ════════════════════ */
  const gy0=190,gh0=106
  fill(13,gy0,454,gh0,P.pan)
  box(13,gy0,454,gh0,P.bdr2,0.8)
  fill(13,gy0,454,2,P.bdr)
  txt('TREND 24H',20,gy0+13,P.tx3,8)
  txt('— TEMP',360,gy0+13,P.near,8)
  txt('·· HUM',412,gy0+13,P.mid,8)
  const plx=44,ply=gy0+22,plw=412,plh=58
  /* plot grid */
  cx.strokeStyle=P.bdr2;cx.lineWidth=0.5
  for(let i=0;i<=4;i++){const yy=ply+plh*i/4
    cx.beginPath();cx.moveTo(plx,yy);cx.lineTo(plx+plw,yy);cx.stroke()}
  for(let i=0;i<=8;i++){const xx=plx+plw*i/8
    cx.beginPath();cx.moveTo(xx,ply);cx.lineTo(xx,ply+plh);cx.stroke()}
  /* y labels (temp scale 16..26) */
  txt('26',plx-6,ply+4,P.tx3,7,'right')
  txt('21',plx-6,ply+plh/2+3,P.tx3,7,'right')
  txt('16',plx-6,ply+plh+3,P.tx3,7,'right')
  /* x labels */
  for(let i=0;i<=4;i++)
    txt(String(i*6).padStart(2,'0'),plx+plw*i/4,gy0+gh0-6,P.tx3,7,'center')
  const tY=v=>ply+plh*(1-(v-16)/10)
  const hY=v=>ply+plh*(1-(v-30)/40)
  /* humidity — dotted, dimmer */
  cx.fillStyle=P.mid
  for(let i=0;i<=plw;i+=4){
    const u=i/plw
    cx.fillRect(plx+i,hY(hum24(u)),1.6,1.6)
  }
  /* temperature — solid bright with glow */
  cx.globalAlpha=0.25
  cx.strokeStyle=P.near;cx.lineWidth=3;cx.beginPath()
  for(let i=0;i<=plw;i+=2){const u=i/plw
    i===0?cx.moveTo(plx+i,tY(temp24(u))):cx.lineTo(plx+i,tY(temp24(u)))}
  cx.stroke();cx.globalAlpha=1
  cx.strokeStyle=P.near;cx.lineWidth=1.3;cx.beginPath()
  for(let i=0;i<=plw;i+=2){const u=i/plw
    i===0?cx.moveTo(plx+i,tY(temp24(u))):cx.lineTo(plx+i,tY(temp24(u)))}
  cx.stroke()
  /* sweep cursor — the animated element; loops with the frame counter   */
  const cxr=plx+plw*ph
  ln(cxr,ply,cxr,ply+plh,P.vio,1.2)
  const cyv=tY(temp)
  cx.globalAlpha=0.45;dot(cxr,cyv,5,P.vio);cx.globalAlpha=1
  dot(cxr,cyv,2.4,P.wh)
  /* cursor value tag — flips side near the right edge                   */
  const tagL=cxr>plx+plw-72
  const tagX=tagL?cxr-66:cxr+8
  fill(tagX,ply+4,58,14,P.pan2)
  box(tagX,ply+4,58,14,P.vio,0.8)
  txt(`${temp.toFixed(1)}°C`,tagX+29,ply+14,P.wh,9,'center',true)

  /* ── Footer — clock, console toggles, loop sync ── */
  const fy=H-17
  txt(`MET ${hts}`,13,fy+8,P.tx3,8)
  const tog=[['SAMP',true],['CAL',false],['VENT',true],['ION',bl]]
  for(let i=0;i<4;i++){
    const[lab,on]=tog[i],tx0=150+i*56
    fill(tx0,fy,8,8,on?P.gn:css(10,16,48))
    box(tx0,fy,8,8,on?P.gn:P.bdr2,0.7)
    txt(lab,tx0+12,fy+8,on?P.tx2:P.tx3,8)
  }
  txt(`SYNC ${String(frame+1).padStart(2,'0')}/${FRAME_COUNT}`,W-13,fy+8,P.tx2,8,'right')
  dot(W-78,fy+4,3,bl?P.vio:P.vioD)

  dither()
}

/* ── Driver ───────────────────────────────────────────────────────────
 * Grab path: server appends ?vow_frame=N → render exactly that frame.
 * Preview path: self-animate so the dashboard thumbnail shows motion. */
const vf=new URLSearchParams(location.search).get('vow_frame')
if(vf!==null){
  render(parseInt(vf,10)||0)
}else{
  let pf=0
  render(pf)
  setInterval(()=>{pf=(pf+1)%FRAME_COUNT;render(pf)},250)
}
</script></body></html>
