<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMBIENT AURA</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 480px; height: 320px; overflow: hidden; margin: 0; padding: 0;
    background: #000000;
  }
  #canvas { position: absolute; top: 0; left: 0; display: block; }
  #overlay {
    position: absolute; top: 0; left: 0; width: 480px; height: 320px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    font-family: system-ui, -apple-system, sans-serif;
    text-shadow: 0 0 12px rgba(0,0,0,0.9), 0 0 24px rgba(0,0,0,0.7);
  }
  #weather-emoji { font-size: 48px; line-height: 1; margin-bottom: 4px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)); }
  #city-name { color: rgba(255,255,255,0.7); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 2px; }
  #temperature { color: #ffffff; font-size: 56px; font-weight: 100; line-height: 1; letter-spacing: -2px; }
  #condition { color: rgba(255,255,255,0.6); font-size: 10px; letter-spacing: 3px; margin-top: 4px; }
  #wind-info { color: rgba(255,255,255,0.45); font-size: 9px; margin-top: 5px; letter-spacing: 1px; }
  #clock-bottom {
    position: absolute; bottom: 6px; left: 0; width: 480px;
    text-align: center; font-family: 'Courier New', monospace;
    color: rgba(255,255,255,0.35); font-size: 9px; letter-spacing: 2px;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
</style>
</head>
<body data-vow-name="Ambient Aura" data-vow-category="ambient" data-vow-description="Ambient particle aura canvas">
<canvas id="canvas" width="480" height="320"></canvas>
<div id="overlay">
  <div id="weather-emoji">🌐</div>
  <div id="city-name">REYKJAVIK</div>
  <div id="temperature">—°</div>
  <div id="condition">ACQUIRING DATA</div>
  <div id="wind-info">WIND — km/h</div>
</div>
<div id="clock-bottom">00:00:00 UTC</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx    = canvas.getContext('2d');
  var W = 480, H = 320;

  // WMO code mappings
  var WMO = {
    0:'CLEAR',1:'MAINLY CLEAR',2:'PARTLY CLOUDY',3:'OVERCAST',
    45:'FOG',48:'RIME FOG',
    51:'LIGHT DRIZZLE',53:'DRIZZLE',55:'HEAVY DRIZZLE',
    61:'LIGHT RAIN',63:'RAIN',65:'HEAVY RAIN',
    71:'LIGHT SNOW',73:'SNOW',75:'HEAVY SNOW',
    80:'SHOWERS',81:'HEAVY SHOWERS',82:'VIOLENT SHOWERS',
    95:'THUNDERSTORM',96:'THUNDERSTORM+HAIL',99:'SEVERE THUNDERSTORM'
  };

  var WMO_EMOJI = {
    0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',
    51:'🌦️',53:'🌦️',55:'🌧️',61:'🌦️',63:'🌧️',65:'🌧️',
    71:'🌨️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',
    95:'⛈️',96:'⛈️',99:'⛈️'
  };

  // Palette sets per weather category
  var PALETTES = {
    clear:   ['#ffd700','#ff8c00','#ffcc44','#ffe066','#ff6600'],
    cloudy:  ['#4466aa','#6688bb','#8899cc','#aabbdd','#334466'],
    rain:    ['#0077aa','#00aacc','#22ccdd','#0055aa','#33bbcc'],
    snow:    ['#c8e0f0','#e8f4ff','#aaccee','#ddeeff','#bbddff'],
    default: ['#aa00ff','#ff00cc','#00ddff','#cc00ff','#7700ff']
  };

  function getPalette(code) {
    if (code === 0 || code === 1) return PALETTES.clear;
    if (code === 2 || code === 3) return PALETTES.cloudy;
    if (code >= 45 && code <= 55) return PALETTES.cloudy;
    if (code >= 61 && code <= 82) return PALETTES.rain;
    if (code >= 71 && code <= 75) return PALETTES.snow;
    if (code >= 95) return PALETTES.cloudy;
    return PALETTES.default;
  }

  // --- Particle system ---
  var NUM_PARTICLES = 60;
  var LINE_DIST     = 80;
  var particles     = [];
  var currentPalette = PALETTES.default;
  var targetPalette  = PALETTES.default;
  var paletteBlend   = 1.0; // 1 = fully at currentPalette

  // Interpolate two hex colors
  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return [r, g, b];
  }

  function lerpColor(a, b, t) {
    var ca = hexToRgb(a), cb = hexToRgb(b);
    var r = Math.round(ca[0] + (cb[0] - ca[0]) * t);
    var g = Math.round(ca[1] + (cb[1] - ca[1]) * t);
    var bl = Math.round(ca[2] + (cb[2] - ca[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  function pickColor(palette, idx, blend) {
    var i = idx % palette.length;
    if (blend >= 1) return palette[i];
    var prev = currentPalette[i % currentPalette.length];
    return lerpColor(prev, palette[i], blend);
  }

  function initParticle(p) {
    p.x   = Math.random() * W;
    p.y   = Math.random() * H;
    p.vx  = (Math.random() - 0.5) * 0.6;
    p.vy  = (Math.random() - 0.5) * 0.4 + 0.05; // slight downward drift (gravity)
    p.size = Math.random() * 3 + 1;
    p.a   = Math.random() * 0.5 + 0.3;
    p.ci  = Math.floor(Math.random() * PALETTES.default.length);
  }

  for (var i = 0; i < NUM_PARTICLES; i++) {
    var p = {};
    initParticle(p);
    particles.push(p);
  }

  // Transition palette over 3 seconds (180 frames at ~60fps)
  var BLEND_SPEED = 1 / 180;

  function startPaletteTransition(newPalette) {
    currentPalette = targetPalette;
    targetPalette  = newPalette;
    paletteBlend   = 0;
  }

  function drawFrame() {
    // Blend palette
    if (paletteBlend < 1) paletteBlend = Math.min(1, paletteBlend + BLEND_SPEED);

    ctx.clearRect(0, 0, W, H);

    // Update and draw particles
    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;

      // Bounce off edges
      if (pt.x < 0)  { pt.x = 0;  pt.vx = Math.abs(pt.vx); }
      if (pt.x > W)  { pt.x = W;  pt.vx = -Math.abs(pt.vx); }
      if (pt.y < 0)  { pt.y = 0;  pt.vy = Math.abs(pt.vy); }
      if (pt.y > H)  { pt.y = H;  pt.vy = -Math.abs(pt.vy); }

      var col = pickColor(targetPalette, pt.ci, paletteBlend);

      // Draw neural-network connections to nearby particles
      for (var j = i + 1; j < particles.length; j++) {
        var pt2 = particles[j];
        var dx = pt.x - pt2.x;
        var dy = pt.y - pt2.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINE_DIST) {
          var alpha = (1 - dist / LINE_DIST) * 0.18;
          ctx.beginPath();
          ctx.moveTo(pt.x, pt.y);
          ctx.lineTo(pt2.x, pt2.y);
          ctx.strokeStyle = col.replace('rgb(', 'rgba(').replace(')', ',' + alpha + ')');
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }

      // Draw particle
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fillStyle = col.replace('rgb(', 'rgba(').replace(')', ',' + pt.a + ')');
      ctx.fill();
    }

    requestAnimationFrame(drawFrame);
  }

  requestAnimationFrame(drawFrame);

  // --- Weather fetch ---
  var currentCode = -1;

  function windArrow(deg) {
    var dirs = ['N','NE','E','SE','S','SW','W','NW'];
    var idx = Math.round(deg / 45) % 8;
    var arrows = ['↑','↗','→','↘','↓','↙','←','↖'];
    return arrows[idx] + ' ' + dirs[idx];
  }

  function fetchWeather() {
    try {
      fetch('https://api.open-meteo.com/v1/forecast?latitude=64.13&longitude=-21.90&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m&forecast_days=1')
        .then(function (r) { return r.ok ? r.json() : Promise.reject('err'); })
        .then(function (d) {
          var c = d.current || {};
          var temp  = c.temperature_2m;
          var code  = c.weather_code;
          var wspd  = c.wind_speed_10m;
          var wdir  = c.wind_direction_10m;

          if (temp !== undefined) {
            document.getElementById('temperature').textContent = Math.round(temp) + '°';
          }
          if (code !== undefined) {
            document.getElementById('weather-emoji').textContent = WMO_EMOJI[code] || '🌐';
            document.getElementById('condition').textContent = WMO[code] || 'UNKNOWN';
            // Trigger palette transition only if code category changed
            var newPalette = getPalette(code);
            if (code !== currentCode) {
              startPaletteTransition(newPalette);
              currentCode = code;
            }
          }
          if (wspd !== undefined && wdir !== undefined) {
            document.getElementById('wind-info').textContent =
              windArrow(wdir || 0) + '  ' + Math.round(wspd) + ' km/h';
          }
        })
        .catch(function () { /* retain last values */ });
    } catch (e) { /* ignore */ }
  }

  // --- Clock ---
  function tickClock() {
    var n = new Date();
    var t = String(n.getUTCHours()).padStart(2,'0') + ':' +
            String(n.getUTCMinutes()).padStart(2,'0') + ':' +
            String(n.getUTCSeconds()).padStart(2,'0') + ' UTC';
    var el = document.getElementById('clock-bottom');
    if (el) el.textContent = t;
  }

  // Boot
  fetchWeather();
  tickClock();
  setInterval(tickClock, 1000);
  setInterval(fetchWeather, 600000); // auto-refresh every 10 minutes

}());
</script>
</body>
</html>
