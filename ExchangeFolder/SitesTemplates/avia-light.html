<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body id="body"
  data-vow-class="C"
  data-vow-name="HYD SYS Panel"
  data-vow-description="Aviation overhead panel — 4 hydraulic system pressure gauges, moving needles, LED annunciators, Boeing overhead style"
  data-vow-category="ambient"
  data-vow-tags="aviation,cockpit,gauge,panel,hydraulic,boeing,instrument"
  data-vow-frames="16"
  data-vow-fps="8"
  data-vow-refresh="0"
>
<canvas id="c"></canvas>
<script>
'use strict';

const W = window.innerWidth  || 480;
const H = window.innerHeight || 320;
const VW = 480, VH = 320;
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const FRAMES = 16;
const frameParam   = new URLSearchParams(location.search).get('vow_frame');
const initialFrame = parseInt(frameParam ?? '0', 10);
let N = ((initialFrame % FRAMES) + FRAMES) % FRAMES;

/* ── Systems definition ──────────────────────────────────────────────────── */
const SYS = [
  { id:'1', cx: 64,  base:2920, amp:  35, ph:0.0 },
  { id:'2', cx:184,  base:2880, amp:  55, ph:1.3 },
  { id:'3', cx:296,  base:2050, amp: 680, ph:0.7 },
  { id:'4', cx:416,  base:2940, amp:  40, ph:2.2 },
];
const GCY  = 118;
const GR   =  52;
const MAXP = 3000;

const SA = 135 * Math.PI / 180;
const SW = 270 * Math.PI / 180;
function v2a(v) { return SA + Math.max(0, Math.min(1, v / MAXP)) * SW; }

function sysPSI(s) {
  const T = N / FRAMES;
  return Math.max(0, Math.min(MAXP, s.base + Math.sin(T*Math.PI*2 + s.ph) * s.amp));
}

function ledCol(psi) {
  if (psi >= 2500) return '#00CC00';
  if (psi >= 1200) return '#FFAA00';
  return '#FF2200';
}

/* ── Helpers ─────────────────────────────────────────────────────────────── */
function fr(x,y,w,h,c)  { ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function txt(s,x,y,c,px,bold,align) {
  ctx.fillStyle=c; ctx.font=`${bold?'bold ':''}${px}px "Courier New",monospace`;
  ctx.textBaseline='top'; ctx.textAlign=align??'left'; ctx.fillText(s,x,y);
}

/* ── Panel background ────────────────────────────────────────────────────── */
function drawBg() {
  const bg = ctx.createLinearGradient(0,0,0,VH);
  bg.addColorStop(0, '#3C3C3C');
  bg.addColorStop(1, '#2A2A2A');
  ctx.fillStyle = bg; ctx.fillRect(0,0,VW,VH);

  /* Brushed lines — more visible */
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  for (let y=0;y<VH;y+=4) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(VW,y); ctx.stroke(); }

  /* System dividers */
  ctx.strokeStyle = '#252525'; ctx.lineWidth = 1;
  for (const x of [120,240,360]) {
    ctx.beginPath(); ctx.moveTo(x,26); ctx.lineTo(x,VH-4); ctx.stroke();
  }

  /* Corner screws */
  for (const [sx,sy] of [[8,8],[VW-8,8],[8,VH-8],[VW-8,VH-8]]) {
    ctx.strokeStyle='#666'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx-3,sy); ctx.lineTo(sx+3,sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx,sy-3); ctx.lineTo(sx,sy+3); ctx.stroke();
  }
}

/* ── Header ──────────────────────────────────────────────────────────────── */
function drawHeader() {
  fr(0,0,VW,26,'#282828');
  ctx.strokeStyle='#505050'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,26); ctx.lineTo(VW,26); ctx.stroke();
  txt('HYDRAULIC', 12, 7, '#D8D0B0', 11, true);
  txt('SYSTEMS', 97, 7, '#9A9070', 11, false);
  ctx.textAlign='right';
  txt('OVERHEAD PANEL  B737-800', VW-12, 7, '#7A7060', 10, false);
  ctx.textAlign='left';
}

/* ── One gauge face ──────────────────────────────────────────────────────── */
function drawGauge(cx, cy, r, psi) {
  /* Shadow ring */
  ctx.fillStyle = '#1A1A1A';
  ctx.beginPath(); ctx.arc(cx,cy,r+8,0,Math.PI*2); ctx.fill();

  /* Bezel */
  const bz = ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1, cx,cy,r+6);
  bz.addColorStop(0,'#707070'); bz.addColorStop(1,'#3A3A3A');
  ctx.fillStyle=bz; ctx.beginPath(); ctx.arc(cx,cy,r+5,0,Math.PI*2); ctx.fill();

  /* Glass rim */
  ctx.strokeStyle='#999999'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,cy,r+1,0,Math.PI*2); ctx.stroke();

  /* Face */
  ctx.fillStyle='#0E0E0E';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  /* Coloured arc zones — brighter */
  ctx.lineWidth=5;
  /* red 0–1200 */
  ctx.strokeStyle='#CC3300';
  ctx.beginPath(); ctx.arc(cx,cy,r-8,SA,v2a(1200),false); ctx.stroke();
  /* amber 1200–2500 */
  ctx.strokeStyle='#CC9900';
  ctx.beginPath(); ctx.arc(cx,cy,r-8,v2a(1200),v2a(2500),false); ctx.stroke();
  /* green 2500–3000 */
  ctx.strokeStyle='#009933';
  ctx.beginPath(); ctx.arc(cx,cy,r-8,v2a(2500),v2a(MAXP),false); ctx.stroke();

  /* Major ticks every 500 PSI */
  for (let v=0;v<=MAXP;v+=500) {
    const a=v2a(v);
    ctx.strokeStyle='#C0C0C0'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(cx+(r-12)*Math.cos(a), cy+(r-12)*Math.sin(a));
    ctx.lineTo(cx+(r- 2)*Math.cos(a), cy+(r- 2)*Math.sin(a));
    ctx.stroke();
  }
  /* Minor ticks every 250 PSI */
  for (let v=250;v<MAXP;v+=500) {
    const a=v2a(v);
    ctx.strokeStyle='#777777'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(cx+(r-8)*Math.cos(a), cy+(r-8)*Math.sin(a));
    ctx.lineTo(cx+(r-2)*Math.cos(a), cy+(r-2)*Math.sin(a));
    ctx.stroke();
  }

  /* Needle */
  const na=v2a(psi);
  ctx.strokeStyle='#CCCCCC'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(cx-6*Math.cos(na), cy-6*Math.sin(na));
  ctx.lineTo(cx+(r-16)*Math.cos(na), cy+(r-16)*Math.sin(na));
  ctx.stroke();
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx+4*Math.cos(na), cy+4*Math.sin(na));
  ctx.lineTo(cx+(r-16)*Math.cos(na), cy+(r-16)*Math.sin(na));
  ctx.stroke();

  /* Hub */
  ctx.fillStyle='#606060'; ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#DDDDDD'; ctx.beginPath(); ctx.arc(cx,cy,2.5,0,Math.PI*2); ctx.fill();

  /* Lens reflection — more pronounced */
  const ref = ctx.createRadialGradient(cx-r*0.25,cy-r*0.3,0, cx-r*0.1,cy-r*0.2,r*0.55);
  ref.addColorStop(0,'rgba(255,255,255,0.14)'); ref.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=ref; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
}

/* ── LED indicator ───────────────────────────────────────────────────────── */
function led(x,y,w,h,col,label) {
  fr(x-1,y-1,w+2,h+2,'#1A1A1A');
  fr(x,y,w,h,col==='off'?'#181818':col);
  if (col!=='off') {
    ctx.fillStyle=col.replace(')',',0.25)').replace('rgb','rgba');
    fr(x-1,y-1,w+2,h+2,col.replace(')',',0.10)').replace('rgb','rgba'));
  }
  ctx.strokeStyle='#444'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h);
  if (label) {
    ctx.fillStyle='#AAA'; ctx.font='6px "Courier New"';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(label, x+w/2, y+h+2);
    ctx.textAlign='left';
  }
}

/* ── Per-system section ──────────────────────────────────────────────────── */
function drawSystem(s) {
  const psi = sysPSI(s);
  const lc  = ledCol(psi);
  const warn = psi < 2500;
  const blink = warn && (N & 1) === 0;

  /* System label */
  txt('HYD SYS '+s.id, s.cx-30, 30, '#EEE8C8', 10, true);

  /* Gauge */
  drawGauge(s.cx, GCY, GR, psi);

  /* PSI digital readout */
  const psiStr = String(Math.round(psi)).padStart(4,' ');
  txt(psiStr, s.cx-22, GCY+GR+12, warn?lc:'#C0DCC0', 13, true);
  txt('PSI', s.cx+16, GCY+GR+15, '#707070', 8, false);

  /* LED row */
  const ly = GCY + GR + 34;
  led(s.cx-28, ly, 18, 10, blink?'off':lc, 'PRESS');
  const ovht = s.id==='3' && psi < 1500 && (N&1)===0;
  led(s.cx- 6, ly, 18, 10, ovht?'#FF2200':'off', 'OVHT');
  led(s.cx+16, ly, 18, 10, psi>2500?'#00AA00':'off', 'E.PUMP');

  /* Toggle switch */
  const sy2 = ly + 24;
  fr(s.cx-8, sy2, 16, 22, '#252525');
  ctx.strokeStyle='#555'; ctx.lineWidth=1; ctx.strokeRect(s.cx-8, sy2, 16, 22);
  const handleY = psi > 2500 ? sy2+2 : sy2+12;
  fr(s.cx-5, handleY, 10, 10, '#E0E0E0');
  ctx.strokeStyle='#999'; ctx.strokeRect(s.cx-5, handleY, 10, 10);
  txt('ON', s.cx-6, sy2+24, '#888', 7, false);

  /* Air pump button */
  const by2 = sy2 + 40;
  fr(s.cx-14, by2, 28, 14, '#282828');
  ctx.strokeStyle='#4A4A4A'; ctx.lineWidth=1; ctx.strokeRect(s.cx-14, by2, 28, 14);
  fr(s.cx-10, by2+3, 20, 8, psi>1000?'#1A3A1A':'#3A1A1A');
  txt('AIR PUMP', s.cx, by2+4, '#AAAAAA', 6, false, 'center');
}

/* ── Bottom strip ────────────────────────────────────────────────────────── */
function drawBottom() {
  const by = VH - 28;
  fr(0, by, VW, 28, '#242424');
  ctx.strokeStyle='#444'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,by); ctx.lineTo(VW,by); ctx.stroke();

  const warnings = [
    { x:12,  label:'LOW PRESS', active: SYS.some(s=>sysPSI(s)<2500) },
    { x:90,  label:'PUMP FAIL', active: SYS[2] && sysPSI(SYS[2])<1500 },
    { x:168, label:'FLUID LOW', active: false },
    { x:246, label:'OVERHEAT',  active: false },
    { x:324, label:'ISOL VALVE',active: false },
  ];
  for (const w of warnings) {
    const on = w.active && (N&1)===0;
    fr(w.x, by+6, 68, 14, on?'#5A2A00':'#181818');
    ctx.strokeStyle = on?'#FFAA00':'#353535'; ctx.lineWidth=1;
    ctx.strokeRect(w.x, by+6, 68, 14);
    txt(w.label, w.x+34, by+9, on?'#FFCC44':'#555555', 7, true, 'center');
  }

  txt('FR '+String(N+1).padStart(2,'0')+'/'+FRAMES, VW-42, by+9, '#555555', 8, false);
}

/* ── CRT post ────────────────────────────────────────────────────────────── */
function drawScanlines() {
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for (let y=0;y<VH;y+=2) ctx.fillRect(0,y,VW,1);
}
function drawVignette() {
  const g=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.35, VW/2,VH/2,Math.max(VW,VH)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
}

/* ── Compose ─────────────────────────────────────────────────────────────── */
function render() {
  ctx.setTransform(W/VW, 0, 0, H/VH, 0, 0);
  drawBg();
  drawHeader();
  for (const s of SYS) drawSystem(s);
  drawBottom();
  drawScanlines();
  drawVignette();
}

render();

if (frameParam === null) {
  const FPS=8; let last=0;
  (function tick(ts){
    if(ts-last>1000/FPS){last=ts; N=(N+1)%FRAMES; render();}
    requestAnimationFrame(tick);
  })(0);
}
</script>
</body>
</html>
