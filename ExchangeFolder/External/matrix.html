<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matrix Rain</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 480px; height: 320px; overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body id="body" data-vow-name="Matrix" data-vow-category="scifi" data-vow-description="Matrix digital rain display">
<canvas id="screen" width="480" height="320"></canvas>
<script>
'use strict';
const W = 480, H = 320;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

function quantChannel(v, bits) {
    const shift = 8 - bits;
    const q = Math.min((1 << bits) - 1, v >> shift);
    return (q << shift) | (q >> (bits - shift));
}
function snap565(r, g, b) {
    return { r: quantChannel(r,5), g: quantChannel(g,6), b: quantChannel(b,5) };
}
function css(r, g, b) {
    const q = snap565(r, g, b);
    return `rgb(${q.r},${q.g},${q.b})`;
}

function dither() {
    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data;
    function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const oR = d[i], oG = d[i+1], oB = d[i+2];
            const q = snap565(oR, oG, oB);
            d[i] = q.r; d[i+1] = q.g; d[i+2] = q.b;
            const eR = oR-q.r, eG = oG-q.g, eB = oB-q.b;
            if (x+1<W){const j=i+4;d[j]=clamp(d[j]+((eR*7)>>4));d[j+1]=clamp(d[j+1]+((eG*7)>>4));d[j+2]=clamp(d[j+2]+((eB*7)>>4));}
            if (y+1<H){
                if (x>0){const j=((y+1)*W+(x-1))*4;d[j]=clamp(d[j]+((eR*3)>>4));d[j+1]=clamp(d[j+1]+((eG*3)>>4));d[j+2]=clamp(d[j+2]+((eB*3)>>4));}
                {const j=((y+1)*W+x)*4;d[j]=clamp(d[j]+((eR*5)>>4));d[j+1]=clamp(d[j+1]+((eG*5)>>4));d[j+2]=clamp(d[j+2]+((eB*5)>>4));}
                if (x+1<W){const j=((y+1)*W+(x+1))*4;d[j]=clamp(d[j]+(eR>>4));d[j+1]=clamp(d[j+1]+(eG>>4));d[j+2]=clamp(d[j+2]+(eB>>4));}
            }
        }
    }
    ctx.putImageData(img, 0, 0);
}

const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n) { return String(n).padStart(2,'0'); }
let clockStr = '00:00:00', dateStr = 'Mon 01 Jan';
function tickClock() {
    const now = new Date();
    clockStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    dateStr = `${DAY[now.getDay()]} ${pad(now.getDate())} ${MON[now.getMonth()]}`;
}

function fillRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function line(x1,y1,x2,y2,c,t){
    ctx.strokeStyle=c;ctx.lineWidth=t||1;
    const ox=(y1===y2)?0:0.5,oy=(x1===x2)?0:0.5;
    ctx.beginPath();ctx.moveTo(x1+ox,y1+oy);ctx.lineTo(x2+ox,y2+oy);ctx.stroke();
}
function drawText(s,x,y,sz,c,align,bold){
    ctx.fillStyle=c;
    ctx.font=`${bold===false?'':'bold '}${sz}px Arial,Helvetica,sans-serif`;
    ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
    ctx.fillText(String(s),x,y);
}

function tick() { tickClock(); }

// ---- Weather label helper ----
function wLabel(code) {
    if (code === 0) return 'CLEAR';
    if (code <= 2) return 'P.CLOUDY';
    if (code <= 3) return 'CLOUDY';
    if (code <= 48) return 'FOGGY';
    if (code <= 67) return 'RAINY';
    if (code <= 77) return 'SNOWY';
    if (code <= 82) return 'SHOWERS';
    return 'STORMY';
}

// ---- Palette ----
const C = {
    black:   css(  0,   0,   0),
    green0:  css(  0, 252,   0),  // head — brightest
    green1:  css(  0, 192,   0),  // trail near-head
    green2:  css(  0,  96,   0),  // trail far
    green3:  css(  0,  40,   0),  // fading tail
    white:   css(255, 255, 255),
    blue:    css( 20,  60, 180),
    panelBg: css(  0,  12,   0),  // semi-dark overlay tint
    overlayBorder: css(  0, 180,   0),
};

// ---- Matrix rain state ----
const COL_W = 12;                              // pixels per column
const COLS  = Math.floor(W / COL_W);          // 40 columns
const ROWS  = Math.floor(H / COL_W);          // 26 rows

const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

// Each column: head row position (-1 = inactive), speed (rows per step)
const colHead  = new Array(COLS).fill(-1);
const colSpeed = new Array(COLS).fill(1);
// Per-cell: character and brightness level (0=off, 1=dim, 2=mid, 3=bright, 4=head)
const cells = Array.from({ length: ROWS }, () =>
    new Array(COLS).fill(0).map(() => ({ ch: ' ', level: 0 }))
);

// Stagger initial head positions so rain starts naturally
for (let c = 0; c < COLS; c++) {
    colHead[c]  = -Math.floor(Math.random() * ROWS);
    colSpeed[c] = 1 + (Math.random() < 0.3 ? 1 : 0);  // some columns faster
}

function randomChar() {
    return CHARS[Math.floor(Math.random() * CHARS.length)];
}

// Advance the rain by one step
function stepRain() {
    // Decay all cell brightness
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (cells[r][c].level > 0) cells[r][c].level--;
        }
    }

    // Advance each column head
    for (let c = 0; c < COLS; c++) {
        for (let s = 0; s < colSpeed[c]; s++) {
            colHead[c]++;
            const r = colHead[c];
            if (r >= 0 && r < ROWS) {
                // Assign head character
                cells[r][c].ch    = randomChar();
                cells[r][c].level = 4;  // head = brightest
                // Brighten cells just behind head
                if (r - 1 >= 0 && cells[r-1][c].level < 3) cells[r-1][c].level = 3;
                if (r - 2 >= 0 && cells[r-2][c].level < 2) cells[r-2][c].level = 2;
            }
            // Reset column when head exits bottom
            if (colHead[c] >= ROWS + 4) {
                colHead[c]  = -Math.floor(Math.random() * ROWS * 0.5);
                colSpeed[c] = 1 + (Math.random() < 0.3 ? 1 : 0);
            }
        }
    }
}

// Draw the rain grid onto the canvas (no dither — pure green palette)
function renderMatrix() {
    fillRect(0, 0, W, H, C.black);

    ctx.font = `bold ${COL_W - 1}px "Courier New", monospace`;
    ctx.textBaseline = 'top';

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const cell = cells[r][c];
            if (cell.level === 0) continue;

            let col;
            switch (cell.level) {
                case 4: col = C.green0; break;   // head
                case 3: col = C.green1; break;
                case 2: col = C.green2; break;
                default: col = C.green3; break;
            }

            ctx.fillStyle = col;
            ctx.textAlign = 'left';
            ctx.fillText(cell.ch, c * COL_W, r * COL_W);
        }
    }
}

// ---- Weather overlay (bottom-left, 200×80 px) ----
const OVL_X = 4, OVL_Y = H - 84, OVL_W = 204, OVL_H = 80;

const wx = { city: 'AMSTERDAM', temp: '---', label: '---' };

function fetchWeather() {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=52.37&longitude=4.90&current=temperature_2m,weathercode&timezone=auto')
        .then(r => r.json())
        .then(data => {
            wx.temp  = Math.round(data.current.temperature_2m) + '\u00b0C';
            wx.label = wLabel(data.current.weathercode);
        })
        .catch(() => {});
}

fetchWeather();
setInterval(fetchWeather, 600000);

function drawOverlay() {
    // Dark semi-solid panel — draw as solid dark green tint
    fillRect(OVL_X, OVL_Y, OVL_W, OVL_H, C.panelBg);

    // Border
    ctx.strokeStyle = C.overlayBorder;
    ctx.lineWidth = 1;
    ctx.strokeRect(OVL_X + 0.5, OVL_Y + 0.5, OVL_W - 1, OVL_H - 1);

    // City name
    ctx.fillStyle = C.green0;
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(wx.city, OVL_X + 8, OVL_Y + 16);

    // Temperature
    ctx.fillStyle = C.white;
    ctx.font = 'bold 28px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(wx.temp, OVL_X + 8, OVL_Y + 50);

    // Condition
    ctx.fillStyle = C.green1;
    ctx.font = '11px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(wx.label, OVL_X + 8, OVL_Y + 68);

    // Clock (top-right of overlay)
    ctx.fillStyle = C.green0;
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(clockStr, OVL_X + OVL_W - 8, OVL_Y + 16);

    // Date
    ctx.fillStyle = C.green2;
    ctx.font = '10px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(dateStr, OVL_X + OVL_W - 8, OVL_Y + 30);
}

// ---- Animation loop — target ~20 fps (50 ms per frame) ----
let lastFrameTime = 0;
const FRAME_MS = 50;

function animLoop(ts) {
    if (ts - lastFrameTime >= FRAME_MS) {
        lastFrameTime = ts;
        stepRain();
        renderMatrix();
        drawOverlay();
        // Apply dither only to the overlay region to keep rain crisp
        dither();
    }
    requestAnimationFrame(animLoop);
}

// Start
tickClock();
setInterval(tick, 1000);
requestAnimationFrame(animLoop);
</script>
</body>
</html>
