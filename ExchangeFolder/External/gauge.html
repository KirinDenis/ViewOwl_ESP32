<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analog Gauges — Vienna</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; width: 480px; height: 320px; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body id="body" data-vow-name="Gauge" data-vow-category="system" data-vow-description="System gauge and metrics panel">
<canvas id="screen" width="480" height="320"></canvas>
<script>
'use strict';
const W = 480, H = 320;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

function quantChannel(v, bits) {
    const shift = 8 - bits;
    const q = Math.min((1 << bits) - 1, v >> shift);
    return (q << shift) | (q >> (bits - shift));
}
function snap565(r, g, b) {
    return { r: quantChannel(r,5), g: quantChannel(g,6), b: quantChannel(b,5) };
}
function css(r, g, b) {
    const q = snap565(r, g, b);
    return `rgb(${q.r},${q.g},${q.b})`;
}

function dither() {
    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data;
    function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const oR = d[i], oG = d[i+1], oB = d[i+2];
            const q = snap565(oR, oG, oB);
            d[i] = q.r; d[i+1] = q.g; d[i+2] = q.b;
            const eR = oR-q.r, eG = oG-q.g, eB = oB-q.b;
            if (x+1<W){const j=i+4;d[j]=clamp(d[j]+((eR*7)>>4));d[j+1]=clamp(d[j+1]+((eG*7)>>4));d[j+2]=clamp(d[j+2]+((eB*7)>>4));}
            if (y+1<H){
                if (x>0){const j=((y+1)*W+(x-1))*4;d[j]=clamp(d[j]+((eR*3)>>4));d[j+1]=clamp(d[j+1]+((eG*3)>>4));d[j+2]=clamp(d[j+2]+((eB*3)>>4));}
                {const j=((y+1)*W+x)*4;d[j]=clamp(d[j]+((eR*5)>>4));d[j+1]=clamp(d[j+1]+((eG*5)>>4));d[j+2]=clamp(d[j+2]+((eB*5)>>4));}
                if (x+1<W){const j=((y+1)*W+(x+1))*4;d[j]=clamp(d[j]+(eR>>4));d[j+1]=clamp(d[j+1]+(eG>>4));d[j+2]=clamp(d[j+2]+(eB>>4));}
            }
        }
    }
    ctx.putImageData(img, 0, 0);
}

const HEADER_H = 36, FOOTER_H = 24;
const CONTENT_Y = HEADER_H, CONTENT_H = H - HEADER_H - FOOTER_H;
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n) { return String(n).padStart(2,'0'); }
let clockStr = '00:00:00', dateStr = 'Mon 01 Jan';
function tickClock() {
    const now = new Date();
    clockStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    dateStr = `${DAY[now.getDay()]} ${pad(now.getDate())} ${MON[now.getMonth()]}`;
}

function fillRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function line(x1,y1,x2,y2,c,t){
    ctx.strokeStyle=c;ctx.lineWidth=t||1;
    const ox=(y1===y2)?0:0.5,oy=(x1===x2)?0:0.5;
    ctx.beginPath();ctx.moveTo(x1+ox,y1+oy);ctx.lineTo(x2+ox,y2+oy);ctx.stroke();
}
function drawText(s,x,y,sz,c,align,bold){
    ctx.fillStyle=c;
    ctx.font=`${bold===false?'':'bold '}${sz}px Arial,Helvetica,sans-serif`;
    ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
    ctx.fillText(String(s),x,y);
}

function redraw() {
    ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.lineWidth=1;ctx.lineCap='butt';
    render();
    dither();
}
function tick() { tickClock(); redraw(); }

// --- Weather fetch for Vienna ---
// Open-Meteo: no API key required
const LAT = 48.21, LON = 16.37;
let wx = { temp: null, humidity: null, wind: null, pressure: null };

function fetchWeather() {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relativehumidity_2m,windspeed_10m,surface_pressure&timezone=Europe%2FVienna`)
        .then(r => r.json())
        .then(data => {
            const c = data.current;
            wx.temp     = c.temperature_2m;
            wx.humidity = c.relativehumidity_2m;
            wx.wind     = c.windspeed_10m;
            wx.pressure = c.surface_pressure;
        })
        .catch(() => { /* keep previous values on error */ });
}

// Gauge arc spans 270° like a speedometer:
// Start angle = 135° (bottom-left), end = 45° (bottom-right) going clockwise.
// In canvas: 0° is right, angles increase clockwise.
const ARC_START = Math.PI * 0.75;   // 135°
const ARC_END   = Math.PI * 2.25;   // 405° = 45° + full rotation
const ARC_SWEEP = Math.PI * 1.5;    // 270°

// Draw one semicircular speedometer-style gauge
// cx,cy = center of gauge  r = outer arc radius  gw = arc stroke width
function drawGauge(cx, cy, r, gw, label, unit, value, minV, maxV, color, decimalPlaces) {
    const BGCOL  = css(32, 32, 40);
    const TXTCOL = css(220, 220, 220);

    // Background arc
    ctx.save();
    ctx.strokeStyle = BGCOL;
    ctx.lineWidth   = gw;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, r, ARC_START, ARC_END);
    ctx.stroke();

    // Value arc
    const frac   = (value === null) ? 0 : Math.max(0, Math.min(1, (value - minV) / (maxV - minV)));
    const endAng = ARC_START + ARC_SWEEP * frac;
    ctx.strokeStyle = color;
    ctx.lineWidth   = gw;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, r, ARC_START, endAng);
    ctx.stroke();

    ctx.restore();

    // Needle from center pointing to value angle
    const needleAng = ARC_START + ARC_SWEEP * frac;
    const needleLen = r - gw - 4;
    const nx = cx + Math.cos(needleAng) * needleLen;
    const ny = cy + Math.sin(needleAng) * needleLen;
    line(cx, cy, Math.round(nx), Math.round(ny), color, 2);

    // Center dot
    ctx.fillStyle = css(200, 200, 200);
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();

    // Value text (large, center)
    const valStr = value === null ? '---' : value.toFixed(decimalPlaces);
    drawText(valStr, cx, cy - 8, 22, TXTCOL, 'center', true);

    // Unit below value
    drawText(unit, cx, cy + 12, 11, css(160, 160, 160), 'center', false);

    // Min / max labels at arc endpoints
    const minX = cx + Math.cos(ARC_START) * (r + 2);
    const minY = cy + Math.sin(ARC_START) * (r + 2);
    const maxX = cx + Math.cos(ARC_END)   * (r + 2);
    const maxY = cy + Math.sin(ARC_END)   * (r + 2);
    drawText(String(minV), Math.round(minX), Math.round(minY) + 10, 9, css(100, 100, 100), 'center', false);
    drawText(String(maxV), Math.round(maxX), Math.round(maxY) + 10, 9, css(100, 100, 100), 'center', false);

    // Gauge name at top
    drawText(label, cx, cy - r - gw / 2 - 6, 11, TXTCOL, 'center', true);
}

// Layout: 2x2 grid, each cell 240x160
// Cell centres
const CELLS = [
    { cx: 120, cy: HEADER_H + 80 },  // top-left  — temperature
    { cx: 360, cy: HEADER_H + 80 },  // top-right — humidity
    { cx: 120, cy: HEADER_H + 80 + 160 }, // bottom-left  — wind
    { cx: 360, cy: HEADER_H + 80 + 160 }, // bottom-right — pressure
];

// We nudge the arc centres up within each cell so labels fit below
function render() {
    fillRect(0, 0, W, H, css(4, 4, 8));

    // Header
    fillRect(0, 0, W, HEADER_H, css(0, 20, 40));
    line(0, HEADER_H - 1, W, HEADER_H - 1, css(0, 70, 140));
    drawText('VIENNA WEATHER', 8, 25, 15, css(0, 200, 248), 'left', true);
    drawText(clockStr, W - 8, 25, 14, css(248, 248, 248), 'right', false);
    drawText(dateStr,  W - 8, 13, 10, css(120, 160, 200), 'right', false);

    // Vertical divider
    line(240, HEADER_H, 240, H - FOOTER_H, css(0, 40, 80));
    // Horizontal divider
    line(0, HEADER_H + 160, W, HEADER_H + 160, css(0, 40, 80));

    // Draw 4 gauges — arc centre is offset up within each 240x160 cell
    const R = 56, GW = 14;
    const offY = -10; // shift arc centre up so labels fit

    // Temperature (-20 to +50°C), cyan
    drawGauge(CELLS[0].cx, CELLS[0].cy + offY, R, GW,
              'TEMPERATURE', '°C', wx.temp, -20, 50, css(0, 220, 248), 1);

    // Humidity (0-100%), blue
    drawGauge(CELLS[1].cx, CELLS[1].cy + offY, R, GW,
              'HUMIDITY', '%', wx.humidity, 0, 100, css(0, 100, 248), 0);

    // Wind speed (0-100 km/h), yellow
    drawGauge(CELLS[2].cx, CELLS[2].cy + offY, R, GW,
              'WIND SPEED', 'km/h', wx.wind, 0, 100, css(248, 220, 0), 1);

    // Pressure (960-1060 hPa), green
    drawGauge(CELLS[3].cx, CELLS[3].cy + offY, R, GW,
              'PRESSURE', 'hPa', wx.pressure, 960, 1060, css(0, 220, 80), 0);

    // Footer
    const footY = H - FOOTER_H;
    fillRect(0, footY, W, FOOTER_H, css(0, 16, 32));
    line(0, footY, W, footY, css(0, 64, 128));
    drawText('VIENNA  48.21°N 16.37°E', 8, footY + 16, 11, css(80, 120, 160), 'left', false);
    drawText(clockStr, W - 8, footY + 16, 11, css(80, 120, 160), 'right', false);
}

fetchWeather();
setInterval(fetchWeather, 600000); // refresh every 10 minutes
tickClock();
redraw();
setInterval(tick, 1000);
</script>
</body>
</html>
