<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ViewOwl — Sign In</title>
  <style>
    /* Dark sci-fi theme matching the landing page */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #080c18;
      font-family: 'Courier New', monospace;
      color: #4dd0e1;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(77,208,225,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77,208,225,0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: gridMove 25s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translate(0,0); }
      100% { transform: translate(30px,30px); }
    }

    /* Scanline */
    body::after {
      content: '';
      position: fixed;
      left: 0; right: 0;
      height: 2px;
      background: rgba(77,208,225,0.15);
      animation: scan 5s linear infinite;
      z-index: 0;
    }
    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }

    .login-box {
      position: relative;
      z-index: 1;
      width: 380px;
      border: 1px solid rgba(77,208,225,0.4);
      background: rgba(8,12,24,0.92);
      box-shadow: 0 0 30px rgba(77,208,225,0.15), inset 0 0 40px rgba(77,208,225,0.03);
      padding: 2.5rem;
      animation: fadeUp .4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Corner decorations */
    .login-box::before, .login-box::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border-color: #4dd0e1;
      border-style: solid;
    }
    .login-box::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .login-box::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #4dd0e1;
      text-shadow: 0 0 20px rgba(77,208,225,0.5);
    }
    .brand-name span { color: #00d4ff; font-weight: 300; }
    .brand-sub {
      font-size: .75rem;
      color: rgba(77,208,225,0.5);
      letter-spacing: 0.2em;
      margin-top: .3rem;
    }

    .form-label {
      display: block;
      font-size: .75rem;
      letter-spacing: .15em;
      color: rgba(77,208,225,0.6);
      margin-bottom: .4rem;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      border: 1px solid rgba(77,208,225,0.25);
      background: rgba(77,208,225,0.03);
      margin-bottom: 1.2rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap:focus-within {
      border-color: #4dd0e1;
      box-shadow: 0 0 8px rgba(77,208,225,0.2);
    }

    .input-icon {
      padding: .6rem .8rem;
      color: rgba(77,208,225,0.4);
      font-size: .8rem;
    }

    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #4dd0e1;
      font-family: 'Courier New', monospace;
      font-size: .9rem;
      padding: .6rem .6rem .6rem 0;
    }
    .input-wrap input::placeholder { color: rgba(77,208,225,0.25); }

    .btn-signin {
      width: 100%;
      padding: .8rem;
      background: transparent;
      border: 1px solid #4dd0e1;
      color: #4dd0e1;
      font-family: 'Courier New', monospace;
      font-size: .9rem;
      letter-spacing: .2em;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }
    .btn-signin::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(77,208,225,0);
      transition: background .2s;
    }
    .btn-signin:hover::before { background: rgba(77,208,225,0.08); }
    .btn-signin:hover { box-shadow: 0 0 15px rgba(77,208,225,0.3); }
    .btn-signin:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      display: none;
      background: rgba(255,51,102,0.12);
      border: 1px solid rgba(255,51,102,0.4);
      color: #ff3366;
      font-size: .8rem;
      padding: .6rem .8rem;
      margin-bottom: 1rem;
      letter-spacing: .05em;
    }
    .error-msg.visible { display: block; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: .75rem;
      color: rgba(77,208,225,0.4);
      text-decoration: none;
      letter-spacing: .1em;
    }
    .back-link:hover { color: #4dd0e1; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(7px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .shake { animation: shake .4s ease; }
  </style>
</head>
<body>
  <div class="login-box" id="login-box">
    <div class="brand">
      <div class="brand-name">View<span>Owl</span></div>
      <div class="brand-sub">ESP32 DISPLAY MANAGER</div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form" autocomplete="off">
      <label class="form-label" for="login-input">&#9658; LOGIN</label>
      <div class="input-wrap">
        <span class="input-icon">&#11041;</span>
        <input type="text" id="login-input" name="username"
               placeholder="enter login" autofocus autocomplete="off" required />
      </div>

      <label class="form-label" for="password-input">&#9658; PASSWORD</label>
      <div class="input-wrap">
        <span class="input-icon">&#11041;</span>
        <input type="password" id="password-input" name="password"
               placeholder="enter password" autocomplete="new-password" required />
      </div>

      <button type="submit" id="btn-signin" class="btn-signin">
        <span id="btn-text">[ AUTHENTICATE ]</span>
      </button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect immediately if already authenticated
    if (auth.isLoggedIn()) window.location.href = "/dashboard.html";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loginVal = document.getElementById("login-input").value.trim();
      const passVal  = document.getElementById("password-input").value;
      const errEl    = document.getElementById("error-msg");
      const btn      = document.getElementById("btn-signin");
      const btnText  = document.getElementById("btn-text");
      const box      = document.getElementById("login-box");

      errEl.classList.remove("visible");
      btn.disabled = true;
      btnText.textContent = "[ AUTHENTICATING... ]";

      const error = await auth.login(loginVal, passVal);

      btn.disabled = false;
      btnText.textContent = "[ AUTHENTICATE ]";

      if (error) {
        errEl.textContent = "\u26a0 " + error;
        errEl.classList.add("visible");
        // Force reflow to restart animation
        box.classList.remove("shake");
        void box.offsetWidth;
        box.classList.add("shake");
      }
    });
  </script>
  <!-- Beta / development preview banner -->
  <script src="js/beta-banner.js"></script>
</body>
</html>
